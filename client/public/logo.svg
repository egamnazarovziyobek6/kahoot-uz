<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="badge">
      <rect width="64" height="64" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <!-- fon -->
    <rect width="64" height="64" fill="#0b1220" />

    <!-- O'zbekiston bayrog'i chiziqlari -->
    <rect width="64" height="19.5" y="0" fill="#0099B5" />
    <rect width="64" height="3" y="19.5" fill="#CE1126" />
    <rect width="64" height="19" y="22.5" fill="#fff" />
    <rect width="64" height="3" y="41.5" fill="#CE1126" />
    <rect width="64" height="19.5" y="44.5" fill="#1EB53A" />

    <!-- oy va yulduzlar -->
    <circle cx="12.5" cy="9" r="5.4" fill="#fff" />
    <circle cx="14.3" cy="9" r="5.4" fill="#0099B5" />
    <g fill="#fff">
      <circle cx="21.5" cy="5" r="1.05" />
      <circle cx="25.8" cy="5" r="1.05" />
      <circle cx="21.5" cy="9.2" r="1.05" />
      <circle cx="25.8" cy="9.2" r="1.05" />
      <circle cx="30" cy="9.2" r="1.05" />
    </g>

    <!-- "K!" harflari -->
    <g
      transform="translate(32 33)"
      font-family="'Space Grotesk', Arial, sans-serif"
      font-weight="800"
      text-anchor="middle"
    >
      <text
        x="0"
        y="13"
        font-size="34"
        fill="#0b1220"
        stroke="#0b1220"
        stroke-width="5"
        stroke-linejoin="round"
        paint-order="stroke"
      >
        K!
      </text>
      <text x="0" y="13" font-size="34" fill="#FBF3E4">
        K!
      </text>
    </g>
  </g>
</svg>
