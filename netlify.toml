# Netlify sozlamalari — faqat frontend (client/) joylashtiriladi.
# Jonli o'yin serveri (server/) Netlify'da ishlamaydi — pastdagi izohga qarang.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router uchun: barcha yo'llar index.html'ga (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Statik fayllar uchun kesh
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
